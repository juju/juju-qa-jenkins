- job:
    name: analyse-juju-tics
    node: ephemeral-noble-8c-32g-amd64
    concurrent: true
    description: |-
      Run the TIOBE TICSQServer over a CI run result.
    wrappers:
      - ansicolor
      - workspace-cleanup
      - timestamps
      - credentials-binding:
          - text:
              credential-id: TICSAUTHTOKEN
              variable: TICSAUTHTOKEN
    properties:
      - build-discarder:
          days-to-keep: 30
          num-to-keep: 50
          artifact-days-to-keep: 30
          artifact-num-to-keep: 50
    parameters:
      - validating-string:
          description: The git short hash for the commit you wish to build
          name: SHORT_GIT_COMMIT
          regex: ^\S{{7}}$
          msg: Enter a valid 7 char git sha
    builders:
      - common
      - set-common-environment
      - install-common-tools
      - get-s3-build-details
      - setup-go-environment
      - set-build-description:
          GOVERSION: "$GOVERSION"
      - lockdown-cloud-city
      - shell: |-
          #!/bin/bash
          set -eux
          echo "checking out $GIT_COMMIT..."
          git clone -n https://github.com/juju/juju "$WORKSPACE/juju"
          git -C "$WORKSPACE/juju" checkout "$GIT_COMMIT"
      - shell: |-
          #!/bin/bash
          set -eux
          echo "vendoring go deps..."
          (cd "$WORKSPACE/juju" && go mod vendor)
      - shell: |-
          #!/bin/bash
          set -eux
          echo "installing tools..."
          if [[ "${{COVERAGE_ENABLED:-false}}" == "true" ]]; then
            go install github.com/juju/gocover-cobertura@latest
          fi
          go install honnef.co/go/tools/cmd/staticcheck@v0.6.1
      - shell: !include-raw-verbatim:
          - scripts/tics-coverage-prepare-prologue.sh
          - scripts/tics-coverage.sh
          - scripts/tics-coverage-prepare.sh
      # The branch-selection helper is embedded verbatim at generation time:
      # the job uses NullSCM, so nothing from this repository exists in the
      # agent workspace at runtime. The include list is concatenated with
      # newlines, so the call-site fragment follows the helper definition.
      - shell: !include-raw-verbatim:
          - scripts/tics-analyse.sh
          - scripts/tics-select-project.sh
          - scripts/tics-coverage.sh
          - scripts/tics-run.sh
