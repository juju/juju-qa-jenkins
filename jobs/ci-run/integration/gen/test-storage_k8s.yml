    node: ephemeral-noble-8c-32g-amd64
    concurrent: true
    description: |-
      Test test_update_pool_same_provider_different_storage_class in storage_k8s suite on microk8s
    parameters:
    - validating-string:
        name: SHORT_GIT_COMMIT
        description: 'Enable sub job to be run individually.'
        regex: ^\S{{7}}$
        msg: Enter a valid 7 char git sha
    - choice:
        default: 'amd64'
        description: 'Build arch used to download the build tar.gz.'
        name: BUILD_ARCH
        choices:
        - amd64
        - arm64
        - s390x
        - ppc64el
    - choice:
        default: ''
        description: 'Arch used to boostrap controller.'
        name: BOOTSTRAP_ARCH
        choices:
        - amd64
        - arm64
        - s390x
        - ppc64el
    - choice:
        default: ''
        description: 'Arch used for hosted models.'
        name: MODEL_ARCH
        choices:
        - amd64
        - arm64
        - s390x
        - ppc64el
    - string:
        default: 'microk8s'
        description: 'Cloud to use when bootstrapping Juju'
        name: BOOTSTRAP_CLOUD
    - string:
        default: 'k8s'
        description: 'Provider to use when bootstrapping Juju'
        name: BOOTSTRAP_PROVIDER
    wrappers:
      - default-integration-test-wrapper
      - timeout:
          timeout: 30
          fail: true
          type: absolute
    builders:
      - common
      - select-oci-registry
      - prepare-integration-test
      - conditional-step:
          # Do not run on regexp version match.
          # Accounts for tests which do not exist
          # in later Juju versions.
          condition-kind: not
          condition-operand:
            condition-kind: regex-match
            # Matches Juju >= 4.0; negated above to skip
            # versions from 4.0 onward (task removed in that version).
            regex: "^[5-9].*|^4\\.([0-9]|\\d{{2,}})(\\.|-).*"
            label: "${{JUJU_VERSION}}"
            on-evaluation-failure: "dont-run"
          steps:
            - run-integration-test-microk8s:
                test_name: 'storage_k8s'
                setup_steps: ''
                task_name: 'test_update_pool_same_provider_different_storage_class'
                skip_tasks: 'test_add_unit_attach_storage,test_add_unit_attach_storage_scaling_race_condition,test_add_unit_duplicate_pvc_exists,test_deleted_pvc_recreated_with_new_storage,test_deploy_attach_storage,test_destroy_model_with_detached_storage,test_force_import_filesystem,test_import_filesystem,test_remove_app_while_storage_update_stuck,test_scale_after_storage_update_crash,test_scale_and_update_storage,test_scale_and_update_storage_successive,test_scale_app_with_updated_storage_self_healing,test_scale_down_and_back_up_retains_storage_sizes,test_scale_resumes_after_storage_update_missing_sts,test_storage_update_after_scale_crash,test_update_storage_constraints_validation_error'
    publishers:
      - integration-artifacts

